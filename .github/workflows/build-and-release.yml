name: Build and Release

# When a commit lands on main (direct push or a merged pull request), build the
# Windows NSIS installer and publish a new GitHub Release with the artifact.
#
# The app version is currently fixed at 0.1.0, so each push gets a unique tag of
# the form `v0.1.0-r<run_number>` to avoid collisions with previous releases.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action runs the configured `beforeBuildCommand` (npm run build) and
      # the Rust bundle step, then creates the Release and uploads the NSIS
      # installer as a release asset.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0-r${{ github.run_number }}
          releaseName: "XCopy v0.1.0 (build ${{ github.run_number }})"
          releaseBody: |
            自动构建 — 由 main 分支推送触发。

            - 构建: #${{ github.run_number }}
            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}

            下载下方的 `XCopy_*-setup.exe` 安装包即可在 Windows 10/11 上使用。
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
