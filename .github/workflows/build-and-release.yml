name: Build and Release

# When a commit lands on main, build the Windows NSIS installer and publish a
# GitHub Release. Releases use SemVer-style tags (`v<version>`), so bump
# src-tauri/tauri.conf.json before publishing a new installer.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: release_tag
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $tag already exists; skipping release build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.release_tag.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        if: steps.release_tag.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.release_tag.outputs.exists != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: steps.release_tag.outputs.exists != 'true'
        run: npm ci

      - name: Build and publish release
        if: steps.release_tag.outputs.exists != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "XCopy v${{ steps.version.outputs.version }}"
          releaseBody: |
            Automated build from the main branch.
            - Version: v${{ steps.version.outputs.version }}
            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            Download the `XCopy_*-setup.exe` installer below for Windows 10/11.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
